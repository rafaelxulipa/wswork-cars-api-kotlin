services:
  postgres:
    image: postgres:16-alpine
    container_name: wswork-cars-kt-db
    environment:
      POSTGRES_DB: wswork_cars_kt
      POSTGRES_USER: wswork
      POSTGRES_PASSWORD: wswork123
    ports:
      - "5433:5432"
    volumes:
      - wswork_kt_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wswork -d wswork_cars_kt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wswork_kt_data:
